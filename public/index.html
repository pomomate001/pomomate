<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PomoMate — Birlikte Odaklan, Birlikte Başar</title>
  <meta name="description" content="PomoMate, gerçek zamanlı çalışma odaları ve Pomodoro sayacı ile odaklanmanızı artıran üretkenlik uygulamasıdır." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090B;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .container {
      max-width: 580px;
      width: 100%;
      background: #18181B;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 48px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .logo {
      font-size: 56px;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #A855F7 0%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 16px;
      color: #A1A1AA;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 28px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #A855F7;
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
    }
    .btn-primary:hover {
      background: #9333EA;
      transform: translateY(-2px);
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 14px;
      color: #71717A;
    }
    .footer-links a {
      color: #A1A1AA;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover {
      color: #A855F7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍅</div>
    <h1>PomoMate</h1>
    <p class="subtitle">
      Birlikte odaklan, çalışma odalarında arkadaşlarınla çalış ve verimliliğini zirveye taşı.
    </p>

    <div class="btn-group">
      <a href="https://play.google.com/store/apps/details?id=com.pomomate.app" class="btn btn-primary">
        Google Play'den İndir
      </a>
    </div>

    <div class="footer-links">
      <a href="/privacy">Gizlilik Politikası</a>
      <span>•</span>
      <a href="/terms">Kullanım Koşulları</a>
      <span>•</span>
      <a href="mailto:support@pomomate.app">İletişim</a>
    </div>
  </div>
</body>
</html>
