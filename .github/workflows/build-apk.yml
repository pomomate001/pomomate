name: Build Android (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (apk or aab)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💾 Setup Swap Space (Prevents OOM during C++ compile)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Generate Android Project (Expo Prebuild)
        env:
          EXPO_PUBLIC_ENV: prod
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npx expo prebuild --platform android --clean
          
          # C++ derlemelerinde bellek taşmasını önlemek için mimarileri ve Gradle bellek limitlerini optimize ediyoruz
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: 🔑 Configure Release Keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "No release keystore secret provided, default debug keystore will be used."
          fi

      - name: 🔨 Build APK
        if: "${{ github.event.inputs.build_type != 'aab' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: 🔨 Build AAB (App Bundle for Play Store)
        if: "${{ github.event.inputs.build_type == 'aab' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          else
            ./gradlew bundleRelease --no-daemon --stacktrace
          fi

      - name: 📤 Upload APK Artifact
        if: "${{ github.event.inputs.build_type != 'aab' }}"
        uses: actions/upload-artifact@v4
        with:
          name: PomoMate-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        if: "${{ github.event.inputs.build_type == 'aab' }}"
        uses: actions/upload-artifact@v4
        with:
          name: PomoMate-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

