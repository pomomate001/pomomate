# PomoMate legal pages
# Public: https://aa4626ab7.abacusai.cloud
server {
    listen 80;
    server_name aa4626ab7.vm.internal;

    add_header Cache-Control "max-age=0, s-maxage=60";
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    root /home/ubuntu/pomomate/legal-site;
    index index.html;

    location = / {
        return 200 '<html><body><h2>PomoMate</h2><p><a href="/privacy">Gizlilik Politikası</a> | <a href="/terms">Kullanım Koşulları</a></p></body></html>';
        add_header Content-Type text/html;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }
}
